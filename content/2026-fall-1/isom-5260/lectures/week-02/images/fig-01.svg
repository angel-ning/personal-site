<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 210" role="img" aria-label="从三层架构到 ER 图的主线"><style>/* svg primitives */
  .d-box{fill:#FFFFFF;stroke:#131A22;stroke-width:1.6;}
  .d-box.soft{fill:#F5F7F9;}
