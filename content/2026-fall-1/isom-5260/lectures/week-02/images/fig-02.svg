<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-label="三层架构"><style>/* svg primitives */
  .d-box{fill:#FFFFFF;stroke:#131A22;stroke-width:1.6;}
  .d-box.soft{fill:#F5F7F9;}
  .d-box.hi{fill:#DEE8F4;stroke:#1C4E8A;stroke-width:2;}
  .d-inner{fill:none;stroke:#131A22;stroke-width:1.1;}
  .d-name{font-family:"Archivo","PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;font-size:13px;font-weight:600;fill:#131A22;letter-spacing:.04em;}
  .d-name.hi{fill:#1C4E8A;}
  .d-t{font-family:"Archivo","PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;font-size:12.5px;fill:#131A22;}
  .d-t.sm{font-size:11px;fill:#54626E;}
  .d-t.ac{fill:#1C4E8A;}
  .d-attr{font-family:"Source Serif 4","Songti SC","Noto Serif SC",Georgia,serif;font-size:12.5px;fill:#131A22;}
  .d-pk{text-decoration:underline;text-underline-offset:3px;}
  .d-dbl{stroke:#131A22;stroke-width:1;}
  .d-div{stroke:#C4CCD4;stroke-width:1;}
  .d-line{stroke:#5D6C79;stroke-width:1.6;fill:none;}
  .d-line.dash{stroke-dasharray:5 4;}
  .d-sym{stroke:#5D6C79;stroke-width:1.6;fill:none;}
  .d-symo{stroke:#5D6C79;stroke-width:1.6;fill:#FFFFFF;}
  .d-lbl{font-family:"Source Serif 4","Songti SC","Noto Serif SC",Georgia,serif;font-size:12px;fill:#131A22;}
  .d-note{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:10.5px;fill:#1C4E8A;}
  .d-note.o{fill:#8E5715;}

  </style><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5D6C79"/>
  </marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1C4E8A"/>
  </marker>
</defs><rect width='100%' height='100%' fill='#FFFFFF'/>
          <text class="d-note" x="16" y="46">TIER 1</text>
          <text class="d-name" x="16" y="68">Client tier</text>
          <rect class="d-box soft" x="180" y="20" width="700" height="86" rx="4"/>
          <text class="d-name" x="200" y="50">浏览器 · Browser</text>
          <text class="d-t sm" x="200" y="74">会计、分析师、客服各用各的界面。本地基本不存数据，</text>
          <text class="d-t sm" x="200" y="92">最多缓存一点点。换台电脑登录，看到的东西一模一样。</text>

          <text class="d-note" x="16" y="181">TIER 2</text>
          <text class="d-name" x="16" y="203">App / Web tier</text>
          <rect class="d-box soft" x="180" y="135" width="700" height="86" rx="4"/>
          <text class="d-name" x="200" y="165">应用／Web 服务器</text>
          <text class="d-t sm" x="200" y="189">业务逻辑集中在这里：A/P、A/R、订单处理、库存控制；</text>
          <text class="d-t sm" x="200" y="207">负责连接 DBMS、生成动态页面、管理会话 (session)。</text>

          <text class="d-note" x="16" y="296">TIER 3</text>
          <text class="d-name" x="16" y="318">Enterprise tier</text>
          <rect class="d-box hi" x="180" y="250" width="700" height="86" rx="4"/>
          <text class="d-name hi" x="200" y="280">Enterprise server + DBMS</text>
          <text class="d-t sm ac" x="200" y="304">全组织的交易数据库，或各部门服务器上的数据汇总。</text>
          <text class="d-t sm ac" x="200" y="322">这一层就是本课程要设计的东西。</text>

          <line class="d-line" x1="530" y1="106" x2="530" y2="131" marker-end="url(#ar)" marker-start="url(#ar)"/>
          <line class="d-line" x1="530" y1="221" x2="530" y2="246" marker-end="url(#ar)" marker-start="url(#ar)"/>
        </svg>