  </marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1C4E8A"/>
  </marker>
</defs><rect width='100%' height='100%' fill='#FFFFFF'/>
          <g>
