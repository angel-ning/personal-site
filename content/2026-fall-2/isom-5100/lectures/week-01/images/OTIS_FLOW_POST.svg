<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Post-OTISLINE：数据集中，按阈值自动推送">
<style>
.of-box{fill:#ffffff;stroke:#cfccc4;stroke-width:1.2}
.of-lit{fill:#e8effc;stroke:#2f5fd0;stroke-width:2}
.of-hub{fill:#e8effc;stroke:#2f5fd0;stroke-width:1.6}
.of-solid{stroke:#8b8b93;stroke-width:1.6;fill:none}
.of-faint{stroke:#cfccc4;stroke-width:1.2;fill:none}
.of-dash{stroke:#8b8b93;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.of-push{stroke:#2f5fd0;stroke-width:1.8;fill:none}
.of-ah{fill:#8b8b93}
.of-ahp{fill:#2f5fd0}
.of-t{fill:#16161a;font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;font-size:12.5px;font-weight:500}
.of-h{fill:#16161a;font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;font-size:13px;font-weight:600}
.of-s{fill:#8b8b93;font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;font-size:11.5px}
.of-p{fill:#2f5fd0;font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;font-size:11.5px;font-weight:600}
</style>
<defs>
<marker id="of-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="of-ah"/></marker>
<marker id="of-arr-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="of-ahp"/></marker>
</defs>
<text x="20" y="16" class="of-h">Post-OTISLINE：数据集中，按阈值自动推送</text>
<rect x="40" y="22" width="250" height="36" rx="8" class="of-box"/><text x="165" y="45" class="of-t" text-anchor="middle">大区总裁 / NAO 高层</text>
<rect x="40" y="82" width="250" height="36" rx="8" class="of-box"/><text x="165" y="105" class="of-t" text-anchor="middle">Regional VP</text>
<rect x="40" y="142" width="250" height="36" rx="8" class="of-box"/><text x="165" y="165" class="of-t" text-anchor="middle">District manager（中层）</text>
<rect x="40" y="212" width="250" height="36" rx="8" class="of-box"/><text x="165" y="235" class="of-t" text-anchor="middle">Branch manager</text>
<rect x="40" y="282" width="250" height="36" rx="8" class="of-box"/><text x="165" y="305" class="of-t" text-anchor="middle">Mechanic（维修技工）</text>
<rect x="410" y="142" width="160" height="56" rx="10" class="of-hub"/>
<text x="490" y="166" class="of-t" text-anchor="middle">OTISLINE 中心</text>
<text x="490" y="184" class="of-s" text-anchor="middle">mainframe · 24h · 160 人</text>
<rect x="430" y="282" width="120" height="36" rx="8" class="of-box"/><text x="490" y="305" class="of-t" text-anchor="middle">客户</text>
<line x1="490" y1="282" x2="490" y2="200" class="of-solid" marker-end="url(#of-arr)"/>
<text x="498" y="246" class="of-s">直接打给中心</text>
<line x1="410" y1="190" x2="292" y2="296" class="of-solid" marker-end="url(#of-arr)"/>
<text x="330" y="262" class="of-s">中央派工</text>
<line x1="410" y1="160" x2="292" y2="160" class="of-push" marker-end="url(#of-arr-p)"/>
<line x1="410" y1="150" x2="292" y2="100" class="of-push" marker-end="url(#of-arr-p)"/>
<line x1="410" y1="150" x2="292" y2="40" class="of-push" marker-end="url(#of-arr-p)"/>
<text x="352" y="82" class="of-p" text-anchor="middle">自动推送报告</text>
<line x1="120" y1="282" x2="120" y2="250" class="of-faint" marker-end="url(#of-arr)"/>
</svg>